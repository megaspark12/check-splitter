# ============================================
# Check Splitter — CI/CD Pipeline
# ============================================
# CI: lint + test + e2e on every push/PR
# CD: build Docker image + deploy to Cloud Run on push to main
#
# Deployment path:
#   GitHub Actions is the CANONICAL deploy path.
#   Cloud Build (cloudbuild.yaml) is a manual fallback only.

name: CI/CD

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==========================================
  # Lint: black, isort, mypy
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check --diff app/ tests/

      - name: Check import order (isort)
        run: isort --check --diff app/ tests/

      - name: Type check (mypy)
        # TODO: Remove || true once all type errors are fixed
        run: mypy app/ --ignore-missing-imports --no-error-summary || true

  # ==========================================
  # Test: unit + integration with coverage
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ tests/integration/ \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=70 \
            -v --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ==========================================
  # E2E: Playwright tests against live server
  # ==========================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run E2E tests
        run: pytest tests/e2e/ -v --tb=short
        env:
          RATE_LIMIT_PER_MINUTE: "9999"

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test_server.log
            test_server_err.log
          retention-days: 7

  # ==========================================
  # Docker: build image to verify it works
  # ==========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: check-splitter:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Deploy: push to Artifact Registry + Cloud Run
  # ==========================================
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/check-splitter/app:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/check-splitter/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: check-splitter
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/check-splitter/app:${{ github.sha }}
          region: ${{ vars.GCP_REGION }}

      - name: Verify deployment
        id: healthcheck
        run: |
          URL=$(gcloud run services describe check-splitter \
            --region=${{ vars.GCP_REGION }} \
            --format='value(status.url)')
          echo "service_url=${URL}" >> $GITHUB_OUTPUT

          # Retry health check up to 5 times with backoff
          for i in 1 2 3 4 5; do
            if curl -sf "${URL}/health" | python3 -m json.tool; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Health check attempt $i failed, waiting ${i}0s..."
            sleep $((i * 10))
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "Deployment health check failed — rolling back traffic to previous revision..."
          PREV_REV=$(gcloud run revisions list \
            --service=check-splitter \
            --region=${{ vars.GCP_REGION }} \
            --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)' \
            --limit=2 | tail -1)

          if [ -n "$PREV_REV" ]; then
            gcloud run services update-traffic check-splitter \
              --region=${{ vars.GCP_REGION }} \
              --to-revisions="${PREV_REV}=100"
            echo "Traffic rolled back to revision: ${PREV_REV}"
          else
            echo "WARNING: No previous revision found for rollback"
          fi
